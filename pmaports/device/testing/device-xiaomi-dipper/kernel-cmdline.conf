# Inherited from xiaomi-beryllium. The serial console works around a
# display-initialisation race (drm/msm issue #46) and is also the only
# usable early log channel on dipper without a hardware UART.
console=ttyMSM0,115200
# Keep the framebuffer console alive after the DRM/KMS driver takes over
# from the bootloader's simple-framebuffer; without tty0 the screen goes
# black as soon as fbcon is torn down (no userspace drawing in initramfs).
console=tty0
loglevel=8
-quiet
